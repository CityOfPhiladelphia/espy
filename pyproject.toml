[project]
name = "graph-api-functions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "citygeo-secrets",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
citygeo-secrets = { git = "https://github.com/CityOfPhiladelphia/citygeo_secrets.git" }

[tool.uv.workspace]
members = [
    "graph_helper",
]

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
